script lua
local bands = {}
for i = 1, 13 do
	bands[zlog.bands[i]] = true
end
local modes = {CW = true, SSB = true, FM = true, AM = true}

local function class(code)
	if code < 2000 then
		return 1
	elseif code > 5000 then
		return 3
	end
	return 2
end

function init()
	return {}
end

function add(state, qso)
	if qso.dupe then
		return state, {invalid = "dupe"}
	end
	if not bands[qso.band] then
		return state, {invalid = "band"}
	end
	if not modes[qso.mode] then
		return state, {invalid = "mode"}
	end
	if #string.match(qso.call, "^[%w_]*") < 3 then
		return state, {invalid = "call"}
	end
	if not string.match(qso.rcvd, "^%d%d%d%d+$") then
		return state, {invalid = "rcvd"}
	end
	if not string.match(qso.sent, "^%d%d%d%d+$") then
		return state, {invalid = "sent"}
	end
	local rcvd, sent = class(tonumber(qso.rcvd)), tonumber(qso.sent)
	local score
	if sent == 2 then
		score = 1
	elseif sent == 1 then
		score = ({1, 5, 5})[rcvd]
	else
		score = ({0, 1, 5})[rcvd]
	end
	local cut = utf8.offset(qso.call, 4)
	local mul1 = if cut then string.sub(qso.call, 1, cut - 1) else qso.call
	return state, {score = score, mul1 = mul1, mul2 = qso.rcvd}
end

function total(state, sums)
	return sums.score * sums.mults
end
